name: Android Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release version name'
        required: true
        default: '0.1.0'

permissions:
  contents: read

jobs:
  release:
    name: Build release APK and AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-provider: basic

      - name: Prepare signing keystore when configured
        env:
          HOMEFIT_RELEASE_KEYSTORE_B64: ${{ secrets.HOMEFIT_RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "$HOMEFIT_RELEASE_KEYSTORE_B64" ]; then
            echo "$HOMEFIT_RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/homefit-release.keystore"
          fi

      - name: Build release APK and bundle
        env:
          HOMEFIT_RELEASE_STORE_FILE: ${{ runner.temp }}/homefit-release.keystore
          HOMEFIT_RELEASE_STORE_PASSWORD: ${{ secrets.HOMEFIT_RELEASE_STORE_PASSWORD }}
          HOMEFIT_RELEASE_KEY_ALIAS: ${{ secrets.HOMEFIT_RELEASE_KEY_ALIAS }}
          HOMEFIT_RELEASE_KEY_PASSWORD: ${{ secrets.HOMEFIT_RELEASE_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease bundleRelease

      - name: Upload release outputs
        uses: actions/upload-artifact@v6
        with:
          name: homefit-release-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
